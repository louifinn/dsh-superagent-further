name: release

# A tag such as v0.2.0 builds the tarball, checks that the bundle is in it, and
# attaches it to a GitHub release. The check job runs first so a release never
# carries a commit that does not typecheck, test and build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x', '24.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  pack:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --pack-destination dist
      - name: Check the tarball holds the bundle, the prompts and the client
        run: |
          set -euo pipefail
          tarball="$(ls dist/dsh-superagent-further-*.tgz)"
          echo "tarball=$tarball" >> "$GITHUB_ENV"
          tar -tzf "$tarball" | sort > dist/contents.txt
          for wanted in package/lib/index.js package/lib/client.js package/cordis.patch.yml package/prompts/cli.md package/locale/en.json; do
            grep -qx "$wanted" dist/contents.txt || { echo "missing from the tarball: $wanted"; exit 1; }
          done
      - name: Create the release with the tarball attached
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$tarball" --generate-notes --verify-tag
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-superagent-further-tarball
          path: dist/dsh-superagent-further-*.tgz
          retention-days: 14
